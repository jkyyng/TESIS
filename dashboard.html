<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universidad Externado de Colombia - Análisis de Voz Académica — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#08231A;--bg2:#0D3320;--bg3:#123D28;--bg4:#184A31;
      --border:rgba(200,230,210,0.1);--border2:rgba(200,230,210,0.2);
      --text:#F0F5F0;--muted:#8FAD9B;
      --accent:#2BAF7A;--accent-btn:#1F7A50;--accent2:#5EE0A3;
      --green:#4ADE80;--yellow:#FBBF24;--red:#F87171;--purple:#A78BFA;
      --font-d:'Playfair Display',Georgia,serif;--font-b:'DM Sans',sans-serif;--font-m:'DM Mono',monospace;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;}
    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid rgba(6,63,38,0.15);background:#FFFFFF;backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
    .logo{font-family:var(--font-d);font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;color:#16261C;}
    .logo img{height:30px;width:auto;display:block;}
    .logo span{color:#0B5D36;}
    .header-right{display:flex;align-items:center;gap:10px;}
    .user-badge{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--accent2);font-family:var(--font-m);}
    .btn-sm{background:none;border:1px solid rgba(6,63,38,0.25);border-radius:8px;padding:5px 12px;font-size:12px;color:#5C6B62;cursor:pointer;font-family:var(--font-b);transition:all 0.15s;}
    .btn-sm:hover{color:#16261C;border-color:rgba(6,63,38,0.4);}
    /* Login */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(43,175,122,0.08) 0%,transparent 60%);}
    .login-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:40px;max-width:400px;width:100%;}
    .login-title{font-family:var(--font-d);font-size:26px;font-weight:800;margin-bottom:4px;}
    .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
    .rol-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
    .rol-opt{padding:18px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;transition:all 0.2s;color:var(--text);}
    .grupo-btn{display:block;width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;color:var(--text);font-family:var(--font-b);transition:all 0.2s;}
    .grupo-btn:hover{border-color:var(--accent);background:rgba(43,175,122,0.08);}
    .rol-opt:hover{border-color:var(--accent);transform:translateY(-2px);}
    .rol-opt.selected{border-color:var(--accent);background:rgba(43,175,122,0.1);}
    .rol-opt .ri{font-size:28px;margin-bottom:6px;display:block;}
    .rol-opt .rl{font-size:13px;font-weight:700;font-family:var(--font-d);}
    .fl{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:500;display:block;margin-bottom:6px;}
    .fi{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;font-family:var(--font-b);color:var(--text);width:100%;transition:border-color 0.15s;margin-bottom:10px;}
    .fi:focus{outline:none;border-color:var(--accent);}
    .fm{font-size:12px;min-height:18px;margin-bottom:10px;}
    .fm.err{color:var(--red);}
    .fm.ok{color:var(--green);}
    .btn-p{width:100%;padding:14px;background:var(--accent-btn);color:white;border:none;border-radius:10px;font-family:var(--font-d);font-weight:700;font-size:15px;cursor:pointer;transition:all 0.2s;}
    .btn-p:hover{background:#23935F;transform:translateY(-1px);}
    .btn-p:disabled{background:var(--bg3);color:var(--muted);cursor:not-allowed;transform:none;}
    /* Main */
    .main{padding:28px;max-width:1200px;margin:0 auto;}
    .page-title{font-family:var(--font-d);font-size:26px;font-weight:800;margin-bottom:4px;}
    .page-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
    /* Tabs */
    .tabs{display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--border);}
    .tab{padding:10px 22px;background:none;border:none;color:var(--muted);font-family:var(--font-b);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;}
    .tab:hover{color:var(--text);}
    .tab.active{color:var(--accent2);border-bottom-color:var(--accent2);font-weight:600;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}
    /* KPIs */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;}
    .kpi.highlight{border-color:rgba(43,175,122,0.3);background:rgba(43,175,122,0.05);}
    .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px;}
    .kpi-value{font-family:var(--font-d);font-size:30px;font-weight:800;}
    .kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
    /* Cards */
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;}
    .card-title{font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text);display:flex;align-items:center;gap:8px;}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
    @media(max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr;}}
    /* Table */
    .tw{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;}
    td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(43,175,122,0.03);}
    /* Badges */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
    .b-green{background:rgba(74,222,128,0.12);color:var(--green);border:1px solid rgba(74,222,128,0.2);}
    .b-yellow{background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.2);}
    .b-red{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.2);}
    .b-blue{background:rgba(43,175,122,0.12);color:var(--accent2);border:1px solid rgba(43,175,122,0.2);}
    /* Riesgo / outliers */
    tr.row-risk td{background:rgba(248,113,113,0.09);}
    tr.row-risk td:first-child{box-shadow:inset 3px 0 0 var(--red);}
    .b-risk{background:rgba(248,113,113,0.12);color:#FECACA;border:1px solid rgba(248,113,113,0.35);animation:pulseRisk 2s infinite;}
    @keyframes pulseRisk{0%,100%{opacity:1}50%{opacity:0.65}}
    /* Tarjetas de "necesita atención" (tab Estudiantes) */
    .atencion-card{cursor:pointer;box-shadow:inset 3px 0 0 var(--red);transition:background 0.15s;}
    .atencion-card:hover{background:rgba(248,113,113,0.06);}
    .atencion-cita{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic;line-height:1.5;}
    .atencion-meta{font-size:11px;color:var(--muted);margin-top:8px;}
    /* Interpretación */
    .interp{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
    .interp:last-child{border-bottom:none;}
    .interp .ii{font-size:20px;line-height:1;}
    .interp .it{font-size:13px;color:var(--text);line-height:1.5;}
    .interp .it b{color:var(--accent2);}
    .sel-est{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text);font-family:var(--font-b);}
    .sel-est:focus{outline:none;border-color:var(--accent);}
    /* Sesiones */
    .sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
    .sc{padding:10px 8px;border-radius:10px;text-align:center;border:1px solid var(--border);transition:all 0.2s;}
    .sc.ok{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.3);}
    .sc.no{background:rgba(248,113,113,0.05);border-color:rgba(248,113,113,0.15);}
    .sc .sn{font-family:var(--font-d);font-weight:700;font-size:15px;display:block;margin-bottom:2px;}
    .sc .sf{font-size:10px;color:var(--muted);}
    .sc .st{font-size:10px;margin-top:3px;display:block;}
    .sc.ok .st{color:var(--green);}
    .sc.no .st{color:var(--red);}
    /* Franja de dificultad por sesión (tiraDificultad) */
    .dif-strip{display:flex;flex-wrap:wrap;gap:4px;}
    .dif-box{font-size:9px;font-family:var(--font-m);padding:4px 5px;border-radius:5px;border:1px solid var(--border);color:var(--muted);cursor:default;min-width:22px;text-align:center;}
    .dif-vacio{background:var(--bg3);opacity:0.5;}
    .dif-no{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.3);color:var(--green);}
    .dif-si{background:rgba(248,113,113,0.15);border-color:var(--red);color:var(--red);font-weight:700;}
    .dif-strip.grande .dif-box{font-size:11px;padding:8px 10px;min-width:34px;}
    .dif-box.clicable{cursor:pointer;}
    .dif-box.clicable:hover{filter:brightness(1.25);transform:translateY(-1px);}
    /* Modal de detalle de un audio (transcripción completa + todas las variables contadas) */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
    .modal-overlay.show{display:flex;}
    .modal-card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;position:relative;}
    .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;}
    .modal-close:hover{color:var(--text);}
    .modal-vars{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
    .modal-transcript{background:var(--bg3);border-radius:10px;padding:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;}
    /* Resaltado de palabras clave dentro de la transcripción (ver resaltarTranscripcion) */
    mark.hl-mul{background:rgba(251,191,36,0.35);color:inherit;border-radius:3px;padding:0 2px;}
    mark.hl-dud{background:rgba(167,139,250,0.4);color:inherit;border-radius:3px;padding:0 2px;}
    mark.hl-dif{background:rgba(248,113,113,0.4);color:inherit;border-radius:3px;padding:0 2px;font-weight:700;}
    .hl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px;}
    .hl-legend span mark{padding:1px 5px;}
    /* Progress bar comparativa */
    .cmp-row{display:flex;flex-direction:column;gap:12px;}
    .cmp-item{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:10px;font-size:12px;}
    .cmp-label{color:var(--muted);text-align:right;}
    .cmp-bar{background:var(--bg3);border-radius:4px;height:8px;overflow:hidden;position:relative;}
    .cmp-fill{height:100%;border-radius:4px;transition:width 0.6s ease;}
    .cmp-fill.me{background:var(--accent2);}
    .cmp-fill.best{background:var(--green);}
    .cmp-fill.worst{background:var(--red);}
    .cmp-fill.prom{background:var(--purple);}
    .cmp-val{font-family:var(--font-m);font-size:11px;color:var(--text);}
    .cmp-legend{display:flex;gap:16px;margin-bottom:14px;font-size:11px;}
    .cmp-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
    /* Notas */
    .nota-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
    .nota-card{background:var(--bg3);border-radius:10px;padding:14px;text-align:center;}
    .nota-card-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:6px;}
    .nota-card-value{font-family:var(--font-d);font-size:22px;font-weight:800;}
    /* Spinner */
    .spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:50px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-msg{text-align:center;color:var(--muted);font-size:13px;padding:8px;}
    /* Chart */
    .cw{position:relative;height:220px;}
    .cw-tall{position:relative;height:280px;}
    /* Metric mini */
    .mr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    @media(max-width:600px){.mr{grid-template-columns:repeat(2,1fr);}}
    .ms{background:var(--bg3);border-radius:10px;padding:12px 14px;}
    .msl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px;}
    .msv{font-family:var(--font-d);font-size:18px;font-weight:700;}
    .mss{font-size:10px;color:var(--muted);margin-top:2px;}
    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px 20px;font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all 0.3s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateY(0);}

    /* Pestaña "Por tema (ABSA)" */
    mark.hl-tema{background:rgba(94,224,163,0.3);color:inherit;border-radius:3px;padding:0 2px;}
    .absa-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
    .absa-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font-b);transition:all 0.15s;}
    .absa-chip:hover{color:var(--text);border-color:var(--border2);}
    .absa-chip.active{color:var(--accent2);border-color:var(--accent);background:rgba(43,175,122,0.1);font-weight:600;}
    .absa-cita{padding:14px 0;border-bottom:1px solid var(--border);}
    .absa-cita:last-child{border-bottom:none;}
    .absa-cita-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
    .absa-cita-txt{font-size:13px;line-height:1.6;color:var(--text);}
    .absa-cita .btn-sm{color:var(--accent2);border-color:var(--border2);}
    .absa-cita .btn-sm:hover{border-color:var(--accent);color:var(--text);}
    .heat{border-collapse:separate;border-spacing:3px;width:100%;}
    .heat th{padding:4px 6px;text-align:center;border:none;}
    .heat td.heat-tema{text-align:left;font-size:12px;color:var(--text);padding:4px 10px 4px 0;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;border:none;}
    .heat td.heat-cell{text-align:center;font-family:var(--font-m);font-size:11px;border-radius:6px;padding:7px 4px;min-width:34px;border:none;}
    .absa-vacio{text-align:center;padding:40px 20px;color:var(--muted);}
    .absa-nota{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px;}
  </style>
</head>

<script>
// ── Config ──
const URL_AS = 'https://script.google.com/macros/s/AKfycbw12TxEJDssZ8JYEx7GH7nd0TD5IfELgqki5KmuCbRp7kDlPIdyVO8Aka0zGtQlbIAe0A/exec';
const GRUPOS = {
  edwin_metodos: 'Edwin Muñoz - Métodos Numéricos',
  edwin_algebra: 'Edwin Muñoz - Álgebra Líneal',
  omar_24: 'Omar Palacios - Data Mining (Grupo 2-4)',
  omar_46: 'Omar Palacios - Data Mining (Grupo 4-6)'
};
// Los nombres de estudiantes ya NO viven hardcodeados aquí — vienen del backend
// (roster maestro en Sheets) en cada login/consulta. nombreDe() ahora resuelve
// contra un mapa que se llena en tiempo de ejecución (ver poblarNombres()).
let NOMBRES = {};
function nombreDe(ced){
  const n=NOMBRES[String(ced)];
  if(!n)return String(ced);
  return n;
}
// Etiquetas de sesión (A1, A2, ...) calculadas dinámicamente POR GRUPO a partir de
// las fechas reales que aparecen en los datos de ESE curso. Antes había una tabla
// fija (24/07/2026→A1, 31/07/2026→A2, ...) hardcodeada para un solo curso específico
// — cualquier otro curso con fechas de sesión distintas nunca encontraba coincidencia
// y mostraba la fecha cruda en vez de "A#". Las fechas de Sesion vienen como texto
// 'dd/MM/yyyy', así que ordenarlas con .sort()/.localeCompare() las trata como texto
// y las desordena (ej. '01/07/2026' queda antes que '09/06/2026' porque empieza por
// '0','1') — por eso se parsean a fecha real antes de ordenar.
const SESIONES_POR_GRUPO={};
function getSesionesGrupo(grupoNombre){
  if(SESIONES_POR_GRUPO[grupoNombre]) return SESIONES_POR_GRUPO[grupoNombre];
  const fechas=[...new Set(DATA.filter(r=>r.Grupo===grupoNombre).map(r=>ns(r.Sesion)))];
  fechas.sort((a,b)=>{
    const[da,ma,ya]=a.split('/').map(Number),[db,mb,yb]=b.split('/').map(Number);
    return new Date(ya,ma-1,da)-new Date(yb,mb-1,db);
  });
  const arr=fechas.map((v,i)=>({v,l:'A'+(i+1)}));
  SESIONES_POR_GRUPO[grupoNombre]=arr;
  return arr;
}
function labelSesion(v,grupoNombre){ return getSesionesGrupo(grupoNombre).find(s=>s.v===v)?.l||v; }
function ordenSesion(v,grupoNombre){
  const idx=getSesionesGrupo(grupoNombre).findIndex(s=>s.v===v);
  return idx===-1?Infinity:idx;
}
const CD={plugins:{legend:{labels:{color:'#8FAD9B',font:{family:'DM Sans',size:11}}}},scales:{x:{ticks:{color:'#8FAD9B',font:{size:10},maxRotation:0},grid:{color:'rgba(200,230,210,0.05)'}},y:{ticks:{color:'#8FAD9B',font:{size:10}},grid:{color:'rgba(200,230,210,0.05)'}}}};

let ROL='',CED='',DATA=null,NOTAS=null,GP='',GK='',CH={};
// Alertas del modelo (piloto local, "mientras tanto") — JSON subido a mano a Drive por
// el usuario tras correr el pipeline localmente; leído por Apps Script (leerAlertasModelo())
// y expuesto en action=getDashboard como alertasModelo[NombreGrupo].estudiantes. Puede llegar
// vacío ({}) si todavía no se ha subido nada, o si el curso actual no está en el modelo.
let ALERTAS_MODELO={};
let FILTRO_SESION='',FILTRO_ESTUDIANTE='',TAB_ACTIVA='resumen';
let FILTRO_SESION_EST='';
// Pestaña "Por tema (ABSA)": { grupo_key: {generado,n_audios,n_estudiantes,menciones,transcripciones} }.
// Llega en action=getDashboard como d.absaModelo (mismo contrato que alertasModelo) o se carga a
// mano desde el selector de archivo de la pestaña. NUNCA va embebido en este HTML (trae cédulas y
// transcripciones; ver documentacion.md 3.86).
let ABSA_MODELO={},TEMA_ABSA='',ABSA_LIMITE=25,ABSA_TEMAS_VISTOS=[],ABSA_LISTA_VISTA=[];
// Sub-vista dentro de la pestaña "Estudiantes" (ver 3.107): 'estudiante' o 'tema' — reemplaza
// la antigua pestaña separada "Por tema", ahora es una sola pestaña navegable.
let SUBVISTA_ESTUDIANTES='estudiante';

// ── Login — cédula+clave, igual para profesor y estudiante (ambos viven en el mismo
// roster maestro, distinguidos solo por Vinculo del lado del backend) ──
let gruposDeEstaCedula=[]; // grupos a los que pertenece la cédula que acaba de iniciar sesión
function elegirRol(r){
  ROL=r;
  document.getElementById('opt-p').classList.toggle('selected',r==='p');
  document.getElementById('opt-e').classList.toggle('selected',r==='e');
  document.getElementById('ik').value='';document.getElementById('mk').textContent='';
  document.getElementById('ic').value='';document.getElementById('mc').textContent='';
  document.getElementById('ic').disabled=false;
  document.getElementById('ik').disabled=false;
  document.getElementById('hint-rol').style.display='none';
  document.getElementById('be').disabled=true;
}
function vC(){
  document.getElementById('mc').textContent='';
  vK();
}
function vK(){
  const k=document.getElementById('ik').value.trim();
  const c=document.getElementById('ic').value.trim();
  document.getElementById('be').disabled = !(ROL && c && /^[A-Za-z0-9]{3}$/.test(k));
  document.getElementById('mk').textContent='';
}
async function entrar(){
  if(!ROL){
    document.getElementById('mk').textContent='Elige primero si eres profesor o estudiante';
    document.getElementById('mk').className='fm err';
    return;
  }
  const k=document.getElementById('ik').value.trim().toUpperCase();

async function cargar(){
  try{
    const res=await fetch(`${URL_AS}?action=getDashboard`);
    const d=await res.json();
    if(!d.ok)throw new Error(d.error||'Error');
    DATA=dedupUltimaPorSesion(d.registros);

    if(ROL==='p') renderProf(DATA.filter(r=>r.Grupo===GP), NOTAS[GK]||[]);
    else renderEst(DATA, NOTAS, CED, GK);
  }catch(err){

  }

// ── Utils ──
function ns(s){return String(s||'').split(' ')[0].trim();}
// Si un estudiante (o profesor) mandó más de un audio para la misma sesión, se queda solo con el
// más reciente. Las filas llegan del backend en orden cronológico (siempre se agregan al final),
// así que la última que pisa cada clave Cedula+Sesion es la correcta.
function dedupUltimaPorSesion(rows){
  const m={};
  rows.forEach(r=>{ m[String(r.Cedula)+'|'+ns(r.Sesion)]=r; });
  return Object.values(m);
}
function p(rows,key){const v=rows.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v));return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
// Suma cruda (no promedio) — para "cuántas veces en total", el conteo que sí mide el
// instrumento léxico validado (dudas/dificultad), en vez de un promedio por audio.
function suma(rows,key){return rows.reduce((a,r)=>a+(parseFloat(r[key])||0),0);}
function gb(arr,key){return arr.reduce((acc,r)=>{const k=ns(r[key]||r['Sesion']||key);(acc[k]=acc[k]||[]).push(r);return acc;},{});}
function gbc(arr,key){return arr.reduce((acc,r)=>{(acc[r[key]]=acc[r[key]]||[]).push(r);return acc;},{});}
function notaEst(notas, cedula){
  if(!notas||!notas.length)return null;
  const row=notas.find(r=>String(r['Documento']||r['Cedula']||r['cedula']||'')===String(cedula));
  if(!row)return null;
  return row;
}
// Ya no depende de nombres de columna hardcodeados por grupo (eso se rompía apenas
// cambiaban los grupos, como pasó ahora). Busca cualquier columna que contenga la
// palabra "parcial" o "ep c" como el 50% principal, y promedia todas las demás columnas
// numéricas (menos identificadores obvios) como el otro 50% de actividades.
function calcPromedio(notaRow, grupoKey){
  if(!notaRow)return null;
  const EXCLUIR=['documento','cedula','cédula','nombre','correo','email','vinculo','grupos','grupo','clave','promedio final'];
  let colParcial=null;
  const actividades=[];
  Object.keys(notaRow).forEach(k=>{
    const kl=k.trim().toLowerCase();
    if(EXCLUIR.includes(kl))return;
    const val=parseFloat(notaRow[k]);
    if(isNaN(val))return;
    if(kl.includes('parcial')||kl.includes('ep c')){
      if(colParcial===null)colParcial=val; // la primera columna que matchee como "el parcial"
    } else if(val>0){
      actividades.push(val);
    }
  });
  if(colParcial===null||colParcial<=0)return null;
  const promAct=actividades.length?actividades.reduce((a,b)=>a+b,0)/actividades.length:0;
  return{parcial:colParcial,actividades:promAct,promedio:(colParcial*0.5+promAct*0.5),notaRow};
}
function clasificar(prom){
  if(prom===null||isNaN(prom))return{cls:'b-blue',label:'Sin nota',emoji:'—'};
  // Notas sobre 50 → convertir a escala 5
  const n=prom>10?prom/10:prom;
  if(n>=4.0)return{cls:'b-green',label:'Alto',emoji:'🟢'};
  if(n>=3.0)return{cls:'b-yellow',label:'Medio',emoji:'🟡'};
  return{cls:'b-red',label:'Bajo',emoji:'🔴'};
}
// Promedio del grupo por variable — se usa como referencia de comparación en vez de
// "mejor/peor" (comparar contra un extremo es comparar contra un caso posiblemente atípico,
// inestable con grupos de 14-30 personas; el promedio es una referencia más robusta).
// Es promedio de promedios: primero se promedia cada estudiante, luego se promedian esos
// promedios — así un estudiante que mandó más audios no pesa más que otro en la comparación.
function calcularPromedioGrupo(perfiles){
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const conNota=perfiles.filter(pf=>pf.np);
  const conSim=perfiles.filter(pf=>pf.sim>0);
  const conPpm=perfiles.filter(pf=>pf.ppm>0);
  return{
    rl:avg(perfiles.map(pf=>pf.rl)), mts:avg(perfiles.map(pf=>pf.mts)),
    dds:avg(perfiles.map(pf=>pf.dds)), neg:avg(perfiles.map(pf=>pf.neg)),
    sim:conSim.length?avg(conSim.map(pf=>pf.sim)):0,
    pal:avg(perfiles.map(pf=>pf.pal)),
    ppm:conPpm.length?avg(conPpm.map(pf=>pf.ppm)):0,
    rep:avg(perfiles.map(pf=>pf.rep||0)), dif:avg(perfiles.map(pf=>pf.dif||0)),
    nota:conNota.length?avg(conNota.map(pf=>pf.np.promedio)):null,
  };
}
// Si hay al menos 3 estudiantes con nota, la comparación usa nota (la variable de resultado
// real); si no (típico antes del Parcial 1), cae de vuelta a riqueza léxica como proxy temporal.
function criterioComparacion(perfiles){
  return perfiles.filter(pf=>pf.np).length>=3?'nota':'riqueza_lexica';
}

// Riesgo: puntaje compuesto (z-score combinado de nota, riqueza léxica y similitud coseno,
// cuando existan) en vez de un solo indicador. Umbral estadístico fijo (z < -1, "notablemente
// por debajo del grupo") en vez de forzar siempre el 10% con peor desempeño — con un umbral fijo,
// si nadie está realmente mal, nadie se marca (antes SIEMPRE marcaba a alguien, incluso en un
// grupo donde todos van bien, solo por ser el último de la fila).
// Requiere al menos 5 estudiantes para tener una base estadística mínima razonable.
function calcularRiesgo(perfiles){
  if(perfiles.length<5){ perfiles.forEach(pf=>{pf.riesgo=false;pf.zscore=0;}); return; }
  const zscores=(vals)=>{
    const validos=vals.map((v,i)=>({v,i})).filter(x=>x.v!=null&&!isNaN(x.v));
    if(validos.length<3) return vals.map(()=>null);
    const media=validos.reduce((a,b)=>a+b.v,0)/validos.length;
    const desv=Math.sqrt(validos.reduce((s,x)=>s+(x.v-media)**2,0)/validos.length)||1;
    const out=vals.map(()=>null);
    validos.forEach(x=>{out[x.i]=(x.v-media)/desv;});
    return out;
  };
  const zNota=zscores(perfiles.map(pf=>pf.np?pf.np.promedio:null));
  const zRl=zscores(perfiles.map(pf=>pf.rl));
  const zSim=zscores(perfiles.map(pf=>pf.sim>0?pf.sim:null));
  perfiles.forEach((pf,i)=>{
    // Combina las señales disponibles para ese estudiante (no todas siempre existen:
    // sim. coseno puede faltar si el profesor no ha subido audio de esa sesión aún).
    // Se guarda cada señal con nombre y valor (no solo el z-score compuesto) para poder
    // JUSTIFICAR el badge "En riesgo" en vez de mostrarlo como una caja negra — ver
    // explicarRiesgo().
    const señales=[
      zNota[i]!=null?{nombre:'Nota',z:zNota[i],w:2,valor:pf.np.promedio}:null,   // nota pesa más — es el resultado real
      zRl[i]!=null?{nombre:'Riqueza léxica',z:zRl[i],w:1,valor:pf.rl*100,unidad:'%'}:null,
      zSim[i]!=null?{nombre:'Similitud coseno',z:zSim[i],w:1,valor:pf.sim*100,unidad:'%'}:null,
    ].filter(Boolean);
    if(señales.length===0){ pf.riesgo=false; pf.zscore=0; pf.riesgoSenales=[]; return; }
    const wTotal=señales.reduce((a,s)=>a+s.w,0);
    const zCompuesto=señales.reduce((a,s)=>a+s.z*s.w,0)/wTotal;
    pf.zscore=zCompuesto;
    pf.riesgo=zCompuesto<-1; // más de 1 desviación estándar por debajo del grupo
    pf.riesgoSenales=señales;
  });
}

// Texto legible explicando POR QUÉ un estudiante quedó marcado "en riesgo" — qué
// señal(es) concreta(s) están más por debajo del grupo, no solo el z-score compuesto.
// Se usa en todos los lugares donde aparece el badge "🚨 En riesgo" (tarjeta de atención,
// ficha de detalle, tooltip en la tabla) para que la etiqueta nunca aparezca sin
// justificación.
function explicarRiesgo(pf){
  if(!pf.riesgo||!pf.riesgoSenales||!pf.riesgoSenales.length) return '';
  const relevantes=[...pf.riesgoSenales].filter(s=>s.z<-0.5).sort((a,b)=>a.z-b.z);
  if(!relevantes.length){
    return `Combinación de señales ${Math.abs(pf.zscore).toFixed(1)} desviaciones estándar por debajo del grupo.`;
  }
  const partes=relevantes.map(s=>`${s.nombre} (${s.valor.toFixed(1)}${s.unidad||''}, ${Math.abs(s.z).toFixed(1)} desv. bajo el grupo)`);
  return `En riesgo por: ${partes.join(' · ')}.`;
}
// Traduce las métricas crudas a lectura en lenguaje sencillo.
function interpretar(yo,promedio,criterio){
  const out=[];
  // Riqueza léxica
  if(yo.rl>=0.65) out.push({icon:'🟢',text:`<b>Vocabulario variado.</b> Usa palabras distintas con frecuencia, lo que suele reflejar buen dominio del tema.`});
  else if(yo.rl>=0.45) out.push({icon:'🟡',text:`<b>Vocabulario adecuado.</b> Está en un rango normal, aunque repetir menos palabras podría mejorar la claridad.`});
  else out.push({icon:'🔴',text:`<b>Vocabulario limitado.</b> Repite bastantes palabras; ampliar el vocabulario usado en las respuestas podría ayudar.`});
  // Muletillas
  if(yo.mts<=2) out.push({icon:'🟢',text:`<b>Discurso fluido.</b> Casi no usa muletillas ("o sea", "eh", etc.).`});
  else if(yo.mts<=5) out.push({icon:'🟡',text:`<b>Algunas muletillas.</b> Es un nivel normal, no representa una alerta por sí solo.`});
  else out.push({icon:'🔴',text:`<b>Muchas muletillas.</b> Puede indicar nerviosismo o que la respuesta no fue preparada con anticipación.`});
  // Dudas
  if(yo.dds<=1) out.push({icon:'🟢',text:`<b>Habla con seguridad.</b> Pocas expresiones de duda en sus respuestas.`});
  else if(yo.dds<=3) out.push({icon:'🟡',text:`<b>Duda ocasional.</b> Normal en explicaciones más complejas.`});
  else out.push({icon:'🔴',text:`<b>Duda frecuente.</b> Repasar el tema antes de grabar podría ayudar a responder con más confianza.`});
  // Velocidad de habla (solo si hay dato — puede venir en 0 por audios sin duración registrada)
  if(yo.ppm>0){
    if(yo.ppm>220) out.push({icon:'🏃',text:`<b>Habla muy rápido.</b> Puede ser apuro o ansiedad al grabar; tomarse un momento antes de empezar podría ayudar.`});
    else if(yo.ppm<80) out.push({icon:'🐢',text:`<b>Habla muy despacio.</b> Puede reflejar duda o que la respuesta se está construyendo sobre la marcha.`});
  }
  // Repeticiones de contenido (distinto de muletillas — repetir palabras reales, no relleno)
  if(yo.rep>3) out.push({icon:'🔁',text:`<b>Repite bastante contenido.</b> Frases como "la, la derivada" pueden indicar que se está pensando la respuesta en tiempo real.`});
  // Percepción de dificultad del tema (distinto de "dudas" — esto es sobre el tema, no la seguridad propia)
  if(yo.dif>2) out.push({icon:'😕',text:`<b>Menciona que el tema le pareció difícil.</b> Vale la pena repasarlo o consultar dudas puntuales sobre esta sesión.`});
  // Comparativa vs el PROMEDIO del grupo (no contra el mejor/peor — comparar contra un extremo
  // es comparar contra un posible caso atípico; el promedio es una referencia más estable).
  if(promedio){
    if(criterio==='nota' && yo.nota!=null && promedio.nota!=null && promedio.nota>0){
      const diff=yo.nota-promedio.nota;
      if(diff>=0.3) out.push({icon:'⭐',text:`Su nota está <b>por encima del promedio del grupo</b> (${yo.nota.toFixed(1)} vs. ${promedio.nota.toFixed(1)}).`});
      else if(diff<=-0.3) out.push({icon:'⚠️',text:`Su nota está <b>por debajo del promedio del grupo</b> (${yo.nota.toFixed(1)} vs. ${promedio.nota.toFixed(1)}) — vale la pena revisar qué está pasando.`});
    } else if(promedio.rl>0){
      const diff=yo.rl-promedio.rl;
      if(diff>=0.1) out.push({icon:'⭐',text:`Su riqueza léxica está <b>por encima del promedio del grupo</b>.`});
      else if(diff<=-0.1) out.push({icon:'⚠️',text:`Su riqueza léxica está <b>por debajo del promedio del grupo</b> — vale la pena reforzar este punto.`});
    }
  }
  return out;
}

// DASHBOARD PROFESOR
// ══════════════════════════════════════════════════════
// Deriva {est, sesVistas, perfiles} aplicando los filtros globales activos.
// Se usa tanto en renderProf() como en st() (al cambiar de pestaña hay que
// volver a dibujar las gráficas porque los canvas estaban ocultos y sin tamaño).
function datosFiltradosProf(){
  const d=DATA.filter(r=>r.Grupo===GP);
  const estTodos=d.filter(r=>r.Es_Profesor!=='SÍ'&&String(r.Cedula)!=='654321');
  const sesionesDisponibles=[...new Set(estTodos.map(r=>ns(r.Sesion)))].sort((a,b)=>ordenSesion(a,GP)-ordenSesion(b,GP));

  const construirPerfil=(ced,rows)=>{
    const nr=notaEst(NOTAS[GK]||[],ced);
    const np=calcPromedio(nr,GK);
    return{ced,rows,nr,np,cl:clasificar(np?.promedio||null),
      rl:p(rows,'riqueza_lexica'),mts:p(rows,'conteo_muletillas'),
      dds:p(rows,'conteo_dudas'),neg:p(rows,'conteo_negaciones'),
      sim:p(rows,'similitud_coseno'),pal:p(rows,'num_palabras'),
      ppm:p(rows,'palabras_por_minuto'),rep:p(rows,'conteo_repeticiones'),
      pausas:p(rows,'num_pausas'),pausaProm:p(rows,'pausa_promedio'),
      dif:p(rows,'conteo_percepcion_dificultad'),
      // Conteos crudos (suma, no promedio) — lo único que este dashboard presenta como
      // "medida" del instrumento léxico validado (dudas + percepción de dificultad).
      // Ver documentacion.md 3.85/3.107: el resto de variables (riqueza léxica, muletillas,
      // similitud coseno, velocidad de habla, pausas, repeticiones) NUNCA se validaron como
      // predictoras de desempeño — se dejan calculadas arriba por compatibilidad con el
      // detalle de audio individual, pero ya no se usan para clasificar ni alertar a nadie.
      ddsTotal:suma(rows,'conteo_dudas'), difTotal:suma(rows,'conteo_percepcion_dificultad'),
      get totalMenciones(){return this.ddsTotal+this.difTotal;},
      enviadas:rows.length};
  };

  // perfilesGrupo: solo respeta el filtro de SESIÓN (nunca el de estudiante) — es la base
  // correcta para calcular "mejor/peor del grupo", incluso cuando se está viendo a 1 solo estudiante.
  let estGrupo=estTodos;
  if(FILTRO_SESION) estGrupo=estGrupo.filter(r=>ns(r.Sesion)===FILTRO_SESION);
  const cedsGrupo=[...new Set(estGrupo.map(r=>String(r.Cedula)))];
  // Orden por menciones (no por nota — ver 3.107): quién ha expresado más dudas/dificultad primero.
  const perfilesGrupo=cedsGrupo.map(ced=>construirPerfil(ced,estGrupo.filter(r=>String(r.Cedula)===ced)))
    .sort((a,b)=>b.totalMenciones-a.totalMenciones);

  // est/perfiles: respeta AMBOS filtros — es lo que efectivamente se muestra en tablas/gráficas.
  let est=estGrupo;
  if(FILTRO_ESTUDIANTE) est=est.filter(r=>String(r.Cedula)===FILTRO_ESTUDIANTE);
  const sesVistas=FILTRO_SESION?[FILTRO_SESION]:sesionesDisponibles;
  const ceds=[...new Set(est.map(r=>String(r.Cedula)))];
  const perfiles=FILTRO_ESTUDIANTE?perfilesGrupo.filter(pf=>ceds.includes(pf.ced)):perfilesGrupo;

  return{est,sesVistas,perfiles,perfilesGrupo,estTodos,sesionesDisponibles};
}

  const ceds=[...new Set(est.map(r=>String(r.Cedula)))];
  const cumpl=Math.round((est.length/(Math.max(1,ceds.length)*sesVistas.length))*100)||0;

  const filtrosActivos=FILTRO_SESION||FILTRO_ESTUDIANTE;

  const barraFiltros=`
    <div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">

          ${sesionesDisponibles.map(s=>`<option value="${s}" ${s===FILTRO_SESION?'selected':''}>${labelSesion(s,GP)}</option>`).join('')}
        </select>

          <option value="">Todos</option>

        </select>
      </div>
      ${filtrosActivos?`<button class="btn-sm" onclick="limpiarFiltrosProf()">✕ Limpiar filtros</button>`:''}
    </div>`;

  if(ceds.length===0){
    document.getElementById('dm').innerHTML=`
      <div class="page-title">${GP}</div>
      <div class="page-sub">Análisis de Voz Académica</div>

// Escape mínimo antes de meter texto libre (transcripción real, puede venir con lo que
// sea) dentro de innerHTML — evita que algo como "<" en el audio rompa el modal.
function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=String(s==null?'':s);
  return d.innerHTML;
}

// ── Resaltado de palabras clave en la transcripción ──
// Diccionarios porteados TAL CUAL de scripts\lexico_matching.py (v3, ver
// documentacion.md 3.87/3.88): negación ahora aplica también a DUDAS (antes
// solo DIFICULTAD la tenía), ventana de negación con corte de cláusula en vez
// de N fijo, negadores ampliados (ningún*, menos), y fix del homógrafo
// "no se" (reflexivo, sin tilde) vs "no sé" (duda, con tilde). Se usan SOLO
// para resaltar en el navegador las palabras que ya contó el backend — no se
// recalcula ningún conteo aquí, los números siguen viniendo del pipeline de
// Python (scripts\recalcular_dudas_dificultad_v3.py).
const DICC_MULETILLAS=["eh","ehh","eeh","ah","em","emm","ehm","este","mmm","mmmm","pues","osea","o sea","o sea que","digamos","aja","tipo"];
const DICC_DUDAS=["no se","nose","no sab*","no recuerd*","no record*","no me acuerdo","no me acord*","no comprendi","no comprend*","no capte","no capt*","no entendi","no entend*","no entiend*","no logre entender","no logro entender","no logr* entender","creo","creo que","creia","creiamos","pienso que","pensaba que","supongo","supon*","imagino","imagina","imaginan","imaginas","imaginamos","imaginaba","imaginabamos","imaginate","imaginese","imaginar","imaginado","imaginandome","imaginarmela","imaginarmelo","imaginarselo","me parece","me parece que","nos parece","tal vez","talvez","quizas","quiza","posiblemente","puede ser","puede que","no estoy seguro","no estoy segura","no estaba seguro","no estaba segura","no estamos seguros","mas o menos","algo asi","la verdad no se","honestamente no se","en realidad no se"];
const DICC_DIFICULTAD=["dificil*","dificult*","difisil","complic*","complej*","confund*","confus*","se me complica","no le entiendo bien al tema","cuesta entender","me cuesta","se me cuesta","pesad*","abrumador*","me cost*","nos cost*","le cost*","me siento perdid*","estoy perdid*","me ha cost*","me esta cost*","nos ha cost*","le ha cost*","tan perdid*","poco perdid*"];
const DICC_NEGADORES=new Set(["no","nunca","jamas","tampoco","ni","sin","nada","menos"]);
const DICC_CONECTORES_CORTE=new Set(["pero","sino","aunque"]);
const VENTANA_NEGACION_MAX=8;
const PUNTUACION_CORTE=",.;:";

function esNegador(norm){
  return DICC_NEGADORES.has(norm) || norm.startsWith('ningun');
}

function normalizarPalabra(w){
  return w.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
}

// Tokeniza el texto ORIGINAL (conserva la posición real dentro del string) para poder
// resaltar sobre el texto tal como se ve, sin alterar acentos/mayúsculas/puntuación.
function tokenizarConPosicion(texto){
  const tokens=[];
  const re=/[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+/g;
  let m;
  while((m=re.exec(texto))!==null){
    tokens.push({raw:m[0],norm:normalizarPalabra(m[0]),start:m.index,end:m.index+m[0].length});
  }
  return tokens;
}

// Camina hacia atrás desde i-1 buscando un negador, deteniéndose en el primer
// corte de cláusula (puntuación fuerte o conector adversativo) -- el corte se
// revisa ANTES de considerar cada token candidato, mirando el hueco entre ese
// token y el siguiente (más cercano al match), incluyendo el hueco justo
// antes del match mismo. Ver lexico_matching.py::_negado (misma lógica).
function negado(texto,tokens,i){
  let k=i-1,pasos=0;
  while(k>=0&&pasos<VENTANA_NEGACION_MAX){
    const entre=texto.slice(tokens[k].end,tokens[k+1].start);
    if([...PUNTUACION_CORTE].some(p=>entre.includes(p)))return false;
    if(DICC_CONECTORES_CORTE.has(tokens[k].norm))return false;
    if(esNegador(tokens[k].norm))return true;
    k--;pasos++;
  }
  return false;
}

// Mismo algoritmo de raíz (*) y consumo no-solapado que _contar_lista() en
// procesar_curso.py, pero en vez de solo contar, devuelve los spans [start,end) del
// texto original que matchearon, para poder envolverlos en <mark>.
function encontrarSpans(texto,tokens,diccionario,excluirSiNegado){
  const spans=[];
  const usados=new Array(tokens.length).fill(false);
  diccionario.forEach(entrada=>{
    const palabras=entrada.split(' ');
    const esRaiz=palabras.map(p=>p.endsWith('*'));
    const raices=palabras.map((p,j)=>esRaiz[j]?p.slice(0,-1):p);
    const m=palabras.length;
    let i=0;
    while(i<=tokens.length-m){
      if(usados[i]){i++;continue;}
      let match=true;
      for(let j=0;j<m;j++){
        const t=tokens[i+j];
        if(!t||usados[i+j]){match=false;break;}
        if(esRaiz[j]?!t.norm.startsWith(raices[j]):t.norm!==raices[j]){match=false;break;}
      }
      if(!match){i++;continue;}
      // Fix homógrafo: "no se" solo cuenta como duda si el segundo token es
      // literalmente "sé" (con tilde) en el texto crudo -- "no se" sin tilde
      // es reflexivo/impersonal ("no se ha reflejado"), no expresa duda.
      if(entrada==='no se'&&tokens[i+1].raw.toLowerCase()==='se'){i++;continue;}
      let cuenta=true;
      if(excluirSiNegado&&negado(texto,tokens,i))cuenta=false;
      if(cuenta){
        spans.push({start:tokens[i].start,end:tokens[i+m-1].end});
        for(let j=0;j<m;j++)usados[i+j]=true;
      }
      i+=m;
    }
  });
  return spans;
}

// Resalta en el texto ORIGINAL las palabras de los 3 diccionarios, cada uno con su
// propio color (amarillo=muletillas, morado=dudas, rojo=percepción de dificultad).
function resaltarTranscripcion(texto){
  if(!texto) return '(sin transcripción)';
  const tokens=tokenizarConPosicion(texto);
  const todosSpans=[
    ...encontrarSpans(texto,tokens,DICC_MULETILLAS,false).map(s=>({...s,tipo:'mul'})),
    ...encontrarSpans(texto,tokens,DICC_DUDAS,true).map(s=>({...s,tipo:'dud'})),
    ...encontrarSpans(texto,tokens,DICC_DIFICULTAD,true).map(s=>({...s,tipo:'dif'})),
  ].sort((a,b)=>a.start-b.start);
  let out='';
  let cursor=0;
  todosSpans.forEach(s=>{
    if(s.start<cursor) return; // evita solapes entre diccionarios distintos (prioridad: el que aparece primero en la lista)
    out+=escapeHtml(texto.slice(cursor,s.start));
    out+=`<mark class="hl-${s.tipo}">${escapeHtml(texto.slice(s.start,s.end))}</mark>`;
    cursor=s.end;
  });
  out+=escapeHtml(texto.slice(cursor));
  return out;
}

// Detalle de UNA grabación puntual: transcripción completa + todas las variables que
// calcula el pipeline para ese audio, coloreadas con los mismos umbrales que ya usa
// tAlertas() (para que "rojo" signifique lo mismo en toda la app, no un criterio nuevo).
function verDetalleAudio(cedula,sesionValue){
  const r=DATA.find(x=>x.Grupo===GP&&String(x.Cedula)===String(cedula)&&ns(x.Sesion)===sesionValue);
  if(!r){toast('No se encontró ese audio','error');return;}
  const lbl=labelSesion(sesionValue,GP);
  const num=k=>parseFloat(r[k]||0);
  // Solo se muestran como "alerta" las 2 variables del instrumento léxico validado (dudas,
  // percepción de dificultad — ver 3.107). El resto (muletillas, riqueza léxica, similitud
  // coseno, velocidad de habla, repeticiones, pausas) no se probó como interpretable de
  // desempeño, así que se dejaron de mostrar aquí para no sugerir que sí lo son.
  const vars=[
    {l:'Dudas',v:num('conteo_dudas').toFixed(0),alerta:num('conteo_dudas')>3},
    {l:'Percepción dificultad',v:num('conteo_percepcion_dificultad').toFixed(0),alerta:num('conteo_percepcion_dificultad')>2},
  ];
  document.getElementById('modal-detalle-body').innerHTML=`
    <div class="card-title">${escapeHtml(nombreDe(cedula))} <span style="font-family:var(--font-m);font-size:11px;color:var(--muted);font-weight:400">· ${escapeHtml(cedula)}</span></div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px">${lbl} · ${escapeHtml(ns(r.Sesion))}</div>
    <div class="modal-vars">${vars.map(x=>`<span class="badge ${x.alerta?'b-red':'b-green'}">${x.l}: ${x.v}</span>`).join('')}</div>
    <div class="card-title" style="font-size:12px;margin-top:6px">📝 Transcripción completa</div>
    <div class="hl-legend">
      <span><mark class="hl-mul">muletilla</mark></span>
      <span><mark class="hl-dud">duda</mark></span>
      <span><mark class="hl-dif">percepción de dificultad</mark></span>
    </div>
    <div class="modal-transcript">${resaltarTranscripcion(r.Transcripcion)}</div>
  `;
  document.getElementById('modal-detalle').classList.add('show');
}
function cerrarModalDetalle(){
  document.getElementById('modal-detalle').classList.remove('show');
}

// Atajo desde la tabla de Estudiantes: filtra a un solo estudiante y lo manda a la pestaña

// Badge con la predicción del modelo de riesgo de dos niveles (ver ALERTAS_MODELO, sección
// 3.47 de documentacion.md) — solo aparece si el curso/estudiante ya tiene un resultado
// subido a la carpeta de Drive; si no, no se muestra nada (no bloquea el resto del dash).
function badgeModelo(cedula){
  const entry=(ALERTAS_MODELO[GP]?.estudiantes||[]).find(e=>String(e.cedula_full)===String(cedula));
  if(!entry) return '';
  const map={alto:{cls:'b-red',label:'🔴 Modelo: prioridad máxima'},medio:{cls:'b-yellow',label:'🟡 Modelo: alerta general'},bajo:{cls:'b-green',label:'🟢 Modelo: sin alerta'}};
  const m=map[entry.status]||map.bajo;
  return `<span class="badge ${m.cls}" title="Probabilidad severo: ${Math.round(entry.proba_severo*100)}% · Probabilidad alto: ${Math.round(entry.proba_alto*100)}%">${m.label}</span>`;
}

// Busca, entre los audios de un estudiante, el más reciente donde marcó
// dificultad explícita — para mostrar la frase real, no solo el número.
function citaMasReciente(pf){
  const conDificultad=pf.rows.filter(r=>parseFloat(r.conteo_percepcion_dificultad||0)>0);
  if(!conDificultad.length) return null;
  const ord=[...conDificultad].sort((a,b)=>ordenSesion(ns(b.Sesion),GP)-ordenSesion(ns(a.Sesion),GP));
  const r=ord[0];
  const texto=String(r.Transcripcion||'').trim();
  const corta=texto.length>200?texto.slice(0,200)+'…':texto;
  return{sesion:ns(r.Sesion),texto:corta};
}

// Tarjeta compacta para un estudiante con dudas/dificultad expresadas — nombre, conteo
// total, y la frase real (no solo el número) de su sesión más reciente con dificultad.
// Clic en la tarjeta lleva al detalle completo (pestaña Estudiantes, sub-vista por
// estudiante, con la franja de sesiones y el modal de cada audio).
function tarjetaMenciones(pf,sesVistas){
  const cita=citaMasReciente(pf);
  return `<div class="card atencion-card" onclick="filtrarPorEstudiante('${pf.ced}')">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div>${nombreDe(pf.ced)}<span style="font-family:var(--font-m);font-size:10px;color:var(--muted);margin-left:6px">${pf.ced}</span></div>
      <span class="badge b-red">🗣️ ${pf.totalMenciones} mención${pf.totalMenciones===1?'':'es'}</span>
    </div>
    ${cita?`<div class="atencion-cita">💬 "${escapeHtml(cita.texto)}" <span style="opacity:0.7;font-style:normal">— ${labelSesion(cita.sesion,GP)}</span></div>`:''}
    <div class="atencion-meta">${pf.difTotal} dificultad${pf.difTotal===1?'':'es'} · ${pf.ddsTotal} duda${pf.ddsTotal===1?'':'es'} · Sesiones enviadas: ${pf.enviadas}/${sesVistas.length} · Clic para ver el detalle completo →</div>
  </div>`;
}

// Pestaña "Estudiantes": UNA sola pestaña con dos sub-vistas navegables (ver 3.107) — por
// estudiante (roster + ficha individual) o por tema (ABSA) — en vez de dos pestañas
// separadas, compartiendo siempre los mismos filtros globales de sesión/estudiante.
function tEstudiantes(perfiles,sesVistas){
  return `
    <div class="absa-chips" style="margin-bottom:16px">
      <button class="absa-chip ${SUBVISTA_ESTUDIANTES==='estudiante'?'active':''}" onclick="cambiarSubvista('estudiante')">👥 Por estudiante</button>
      <button class="absa-chip ${SUBVISTA_ESTUDIANTES==='tema'?'active':''}" onclick="cambiarSubvista('tema')">🧩 Por tema</button>
    </div>
    <div id="subvista-contenido">${SUBVISTA_ESTUDIANTES==='tema'?tAbsa():tPorEstudiante(perfiles,sesVistas)}</div>`;
}
function cambiarSubvista(v){
  SUBVISTA_ESTUDIANTES=v;
  if(!DATA)return;
  const{perfiles,sesVistas}=datosFiltradosProf();
  document.getElementById('t-estudiantes').innerHTML=tEstudiantes(perfiles,sesVistas);
  if(v==='tema') setTimeout(()=>renderChartsAbsa(),100);
}

function tPorEstudiante(perfiles,sesVistas){
  if(perfiles.length===1) return fichaEstudianteDetalle(perfiles[0],sesVistas);
  const ordenados=[...perfiles].sort((a,b)=>nombreDe(a.ced).localeCompare(nombreDe(b.ced)));
  const filaTabla=pf=>{
    const pct=Math.round(pf.enviadas/sesVistas.length*100);
    const nDif=pf.rows.filter(r=>parseFloat(r.conteo_percepcion_dificultad||0)>0).length;
    const badgeDif=nDif>0
      ?`<span class="badge b-red" style="cursor:pointer" onclick="filtrarPorEstudiante('${pf.ced}')" title="Ver detalle">⚠️ ${nDif} sesi${nDif>1?'ones':'ón'}</span>`
      :`<span class="badge b-green" style="cursor:pointer" onclick="filtrarPorEstudiante('${pf.ced}')" title="Ver detalle">✅</span>`;
    return `<tr>
      <td>${nombreDe(pf.ced)}<div style="font-family:var(--font-m);font-size:10px;color:var(--muted)">${pf.ced}</div></td>
      <td>${pf.enviadas}/${sesVistas.length} <span style="color:var(--muted);font-size:11px">(${pct}%)</span></td>
      <td>${pf.ddsTotal}</td>
      <td>${pf.difTotal}</td>
      <td>${badgeDif}</td>
    </tr>`;
  };
  return `
    <div class="card" style="font-size:12px;color:var(--muted)">💡 Usa el filtro de arriba (📅 Sesión / 🎓 Estudiante) para ver la ficha completa de una sola persona.</div>
    <div class="tw"><table>
      <tr><th>Estudiante</th><th>Sesiones</th><th>Dudas</th><th>Dificultades</th><th>Detalle</th></tr>
      ${ordenados.map(filaTabla).join('')}
    </table></div>`;
}

// Ficha de detalle de UN estudiante — aparece en la pestaña Estudiantes (sub-vista "Por
// estudiante") cuando el filtro global deja exactamente uno. Ya no compara contra nota,
// riqueza léxica ni similitud coseno (ver 3.107): solo la línea de tiempo de dudas/
// dificultad y, si el análisis por tema está cargado, los temas que mencionó.
function fichaEstudianteDetalle(pf,sesVistas){

// Tarjeta de alertas del modelo (piloto local, "mientras tanto" — ver ALERTAS_MODELO).
// modeloGrupo viene de ALERTAS_MODELO[GP], con la misma forma que arma exportar_datos_dashboard.py:
// {n, n_alto, n_medio, n_bajo, estudiantes:[{cedula_full, status, proba_severo, proba_alto, cita, ...}]}.
function renderAlertaModelo(modeloGrupo){
  if(!modeloGrupo||!modeloGrupo.estudiantes||!modeloGrupo.estudiantes.length){
    return `<div class="card"><div class="card-title">🔮 Alerta del modelo (piloto)</div>
      <div style="color:var(--muted);font-size:13px">Todavía no se ha subido un resultado del modelo para este curso a la carpeta de Drive.</div></div>`;
  }
  const est=modeloGrupo.estudiantes;
  const rojos=est.filter(e=>e.status==='alto');
  const amarillos=est.filter(e=>e.status==='medio');
  const fila=e=>`<tr>
      <td>${nombreDe(e.cedula_full)}<div style="font-family:var(--font-m);font-size:10px;color:var(--muted)">${e.cedula_full}</div></td>
      <td>${Math.round(e.proba_severo*100)}%</td>
      <td>${Math.round(e.proba_alto*100)}%</td>
      <td style="font-size:12px;color:var(--muted)">${e.cita||''}</td>
    </tr>`;
  const tabla=(titulo,filas)=>filas.length?`<div class="card-title" style="margin-top:10px">${titulo}</div><div class="tw"><table>
      <tr><th>Estudiante</th><th>Prob. severo</th><th>Prob. alto</th><th>Última sesión con dificultad</th></tr>
      ${filas.map(fila).join('')}
    </table></div>`:'';
  return `<div class="card">
    <div class="card-title">🔮 Alerta del modelo (piloto local, sin validar aún con nota real de este semestre)</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Predicción de un modelo entrenado sobre semestres anteriores, aplicada a este curso. No es un reporte de aciertos — se podrá validar cuando existan las notas reales de este parcial.</div>
    ${tabla('🔴 Prioridad máxima',rojos)}
    ${tabla('🟡 Alerta general',amarillos)}
    ${!rojos.length&&!amarillos.length?'<div style="color:var(--green);font-size:13px">✅ Sin alertas del modelo en este curso</div>':''}
  </div>`;
}

// Alertas = ranking simple por conteo total de dudas+dificultad expresadas (ver
// documentacion.md 3.107) — NO un modelo predictivo ni un cruce con nota/riqueza léxica/
// similitud coseno. Es literalmente lo que mide el instrumento léxico validado: quién ha
// expresado más dudas o dificultad, en total, a lo largo de las sesiones visibles.
function tAlertas(perfiles,sesVistas){
  const conMenciones=[...perfiles].filter(pf=>pf.totalMenciones>0).sort((a,b)=>b.totalMenciones-a.totalMenciones);
  const pocas=perfiles.filter(pf=>pf.enviadas/sesVistas.length<0.6);
  const cedCol=pf=>`<td>${nombreDe(pf.ced)}<div style="font-family:var(--font-m);font-size:10px;color:var(--muted)">${pf.ced}</div></td>`;

  return `
    <div class="card" style="font-size:12px;color:var(--muted);line-height:1.5">
      🗣️ Ranking simple: estudiantes ordenados por <b style="color:var(--text)">cuántas veces</b>
      expresaron duda o dificultad en total. Es un conteo, no una predicción — sirve para saber con
      quién vale la pena hablar, no para anticipar una nota.
    </div>
    <div class="card-title" style="margin-top:4px">🗣️ Más dudas y dificultades expresadas (${conMenciones.length})</div>
    ${conMenciones.length
      ?conMenciones.map(pf=>tarjetaMenciones(pf,sesVistas)).join('')
      :`<div class="card"><div style="color:var(--green);font-size:13px">✅ Nadie expresó dudas o dificultad en esta selección.</div></div>`}
    ${pocas.length?`<div class="card"><div class="card-title">📭 Bajo cumplimiento (&lt;60%)</div><div class="tw"><table>
      <tr><th>Estudiante</th><th>Enviadas</th><th>%</th></tr>
      ${pocas.map(pf=>`<tr>${cedCol(pf)}<td>${pf.enviadas}/${sesVistas.length}</td><td>${Math.round(pf.enviadas/sesVistas.length*100)}%</td></tr>`).join('')}
    </table></div></div>`:''}`;
}


// ══════════════════════════════════════════════════════
// PESTAÑA "POR TEMA" (ABSA): en qué temas concretos se concentran las dudas y dificultades
// que los estudiantes expresan en sus audios. Es SOLO análisis por tema — no mezcla las
// alertas de riesgo de otras pestañas. Respeta los filtros globales de sesión/estudiante.
// ══════════════════════════════════════════════════════
const ABSA_STOP=new Set(['de','la','el','en','con','para','y','los','las','un','una','del','al','que','como','por','no','mas','tal','vez','sobre','esta','este','esa','ese','lo','se','su','sus','muy','bien']);
function isoADmy(s){const [y,m,d]=String(s).split('-');return `${d}/${m}/${y}`;}
function absaNorm(s){return s.toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');}
function absaGrupo(){return ABSA_MODELO[GK]||null;}
function absaFiltradas(){
  const g=absaGrupo();if(!g)return[];
  let m=g.menciones;
  if(FILTRO_SESION)m=m.filter(x=>isoADmy(x.s)===FILTRO_SESION);
  if(FILTRO_ESTUDIANTE)m=m.filter(x=>String(x.c)===FILTRO_ESTUDIANTE);
  return m;
}
function absaAgregar(ms){
  const temas={};let sinTema=0;
  ms.forEach(m=>{
    if(!m.t.length){sinTema++;return;}
    m.t.forEach(t=>{
      const o=temas[t]=temas[t]||{tema:t,n:0,DUDAS:0,DIFICULTAD:0,ests:new Set(),ses:{}};
      o.n++;o[m.d]++;o.ests.add(String(m.c));
      const s=isoADmy(m.s);o.ses[s]=(o.ses[s]||0)+1;
    });
  });
  return{lista:Object.values(temas).sort((a,b)=>b.n-a.n||a.tema.localeCompare(b.tema)),sinTema};
}
function absaEmpty(){
  return `<div class="card absa-vacio">
    <div style="font-size:34px;margin-bottom:10px">🧩</div>
    <div style="font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px">Aún no hay análisis por tema para este curso</div>
    <div style="font-size:13px;max-width:520px;margin:0 auto 16px;line-height:1.55">Esta pestaña muestra en qué temas concretos se concentran las dudas y dificultades que expresan los estudiantes. Requiere el archivo de análisis generado localmente (<span style="font-family:var(--font-m)">absa_dashboard_data27sept.json</span>), que el backend expone como <span style="font-family:var(--font-m)">absaModelo</span>. Mientras tanto puedes cargarlo a mano — se lee solo en tu navegador, no se sube a ningún lado.</div>
    <label class="btn-sm" style="display:inline-block;cursor:pointer;color:var(--accent2);border-color:var(--accent)">📂 Cargar archivo JSON<input type="file" accept=".json,application/json" style="display:none" onchange="cargarAbsaLocal(this)"/></label>
  </div>`;
}
function absaToast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function cargarAbsaLocal(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!j||typeof j!=='object'||!Object.values(j).every(v=>v&&Array.isArray(v.menciones)))throw new Error('formato');
      ABSA_MODELO=j;TEMA_ABSA='';ABSA_LIMITE=25;
      if(!ABSA_MODELO[GK])absaToast('El archivo no trae datos para este curso ('+GK+')','error');
      else absaToast('Análisis por tema cargado','ok');
      refrescarAbsa();
    }catch(e){absaToast('No se pudo leer el archivo: no tiene el formato esperado','error');}
  };
  rd.readAsText(f,'utf-8');
}
function refrescarAbsa(){
  const el=document.getElementById('subvista-contenido');if(!el)return;
  el.innerHTML=tAbsa();
  renderChartsAbsa();
}
function seleccionarTemaAbsa(i){
  const t=i<0?'':(ABSA_TEMAS_VISTOS[i]||'');
  TEMA_ABSA=(t&&TEMA_ABSA===t)?'':t;ABSA_LIMITE=25;
  refrescarAbsa();
}
function absaMasCitas(){ABSA_LIMITE+=25;refrescarAbsa();}

function absaSnippet(texto,r,d){
  const ini0=Math.max(0,r[0]-110),fin0=Math.min(texto.length,r[1]+110);
  let ini=ini0>0?texto.indexOf(' ',ini0):0;if(ini<0||ini>r[0])ini=ini0;
  let fin=fin0<texto.length?texto.lastIndexOf(' ',fin0):texto.length;if(fin<r[1])fin=fin0;
  const cls=d==='DUDAS'?'hl-dud':'hl-dif';
  return(ini>0?'…':'')+escapeHtml(texto.slice(ini,r[0]))+`<mark class="${cls}">${escapeHtml(texto.slice(r[0],r[1]))}</mark>`+escapeHtml(texto.slice(r[1],fin))+(fin<texto.length?'…':'');
}

function tAbsa(){
  const g=absaGrupo();
  if(!g)return absaEmpty();
  const ms=absaFiltradas();
  const{lista,sinTema}=absaAgregar(ms);
  ABSA_TEMAS_VISTOS=lista.map(x=>x.tema);
  const conTema=ms.length-sinTema;
  const estsConMencion=new Set(ms.map(m=>String(m.c))).size;
  const filtradas=TEMA_ABSA?ms.filter(m=>m.t.includes(TEMA_ABSA)):ms.filter(m=>m.t.length);
  const ordenadas=[...filtradas].sort((a,b)=>b.s.localeCompare(a.s));
  ABSA_LISTA_VISTA=ordenadas;
  const top=lista[0];

  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Menciones con tema</div><div class="kpi-value">${conTema}</div><div class="kpi-sub">${sinTema} sin tema claro</div></div>
    <div class="kpi"><div class="kpi-label">Temas distintos</div><div class="kpi-value">${lista.length}</div><div class="kpi-sub">${estsConMencion} estudiante${estsConMencion===1?'':'s'} con menciones</div></div>
    <div class="kpi highlight" style="grid-column:span 2"><div class="kpi-label">Tema con más menciones</div><div class="kpi-value" style="font-size:20px;line-height:1.25">${top?escapeHtml(top.tema):'—'}</div><div class="kpi-sub">${top?`${top.n} mención${top.n===1?'':'es'} · ${top.ests.size} estudiante${top.ests.size===1?'':'s'}`:'Sin menciones con tema en esta selección'}</div></div>
  </div>`;

  if(!lista.length){
    return kpis+`<div class="card absa-vacio"><div style="font-size:30px;margin-bottom:8px">🔍</div>Sin menciones con tema para esta combinación de filtros.</div>`;
  }

  const nTop=Math.min(12,lista.length);
  const altoTemas=Math.max(220,nTop*30+50);

  // Mapa de calor tema × sesión (top 10 temas)
  const sesCols=getSesionesGrupo(GP).map(s=>s.v).filter(s=>!FILTRO_SESION||s===FILTRO_SESION);
  const top10=lista.slice(0,10);
  const maxCel=Math.max(1,...top10.flatMap(x=>sesCols.map(s=>x.ses[s]||0)));
  const heat=`<div class="tw"><table class="heat">
    <tr><th></th>${sesCols.map(s=>`<th title="${escapeHtml(s)}">${labelSesion(s,GP)}</th>`).join('')}</tr>
    ${top10.map(x=>`<tr><td class="heat-tema" title="${escapeHtml(x.tema)}">${escapeHtml(x.tema)}</td>${sesCols.map(s=>{
      const n=x.ses[s]||0;
      return n?`<td class="heat-cell" style="background:rgba(94,224,163,${(0.15+0.7*n/maxCel).toFixed(2)});color:#08231A;font-weight:700">${n}</td>`:`<td class="heat-cell" style="background:var(--bg3);color:var(--muted);opacity:0.5">·</td>`;
    }).join('')}</tr>`).join('')}
  </table></div>`;

  const chips=`<div class="absa-chips">
    <button class="absa-chip ${TEMA_ABSA?'':'active'}" onclick="seleccionarTemaAbsa(-1)">Todos los temas</button>
    ${lista.slice(0,15).map((x,i)=>`<button class="absa-chip ${TEMA_ABSA===x.tema?'active':''}" onclick="seleccionarTemaAbsa(${i})">${escapeHtml(x.tema)} · ${x.n}</button>`).join('')}
  </div>`;

  const citas=ordenadas.slice(0,ABSA_LIMITE).map((m,i)=>{
    const texto=g.transcripciones[m.k]||'';
    const dmy=isoADmy(m.s);
    return `<div class="absa-cita">
      <div class="absa-cita-head">
        <b style="font-family:var(--font-d)">${escapeHtml(nombreDe(m.c))}</b>
        <span style="color:var(--muted)">${labelSesion(dmy,GP)} · ${escapeHtml(dmy)}</span>
        <span class="badge ${m.d==='DUDAS'?'b-blue':'b-red'}">${m.d==='DUDAS'?'Duda':'Dificultad'}</span>
        ${m.t.map(t=>`<span class="badge b-green">${escapeHtml(t)}</span>`).join('')}
      </div>
      <div class="absa-cita-txt">${absaSnippet(texto,m.r,m.d)}</div>
      <button class="btn-sm" style="margin-top:8px" onclick="verAbsaTranscripcion(${i})">📝 Ver transcripción completa</button>
    </div>`;
  }).join('');

  return `${kpis}
    <div class="grid-2">
      <div class="card"><div class="card-title">🧩 Temas con más dudas y dificultades <span style="font-size:11px;color:var(--muted);font-weight:400">· clic en una barra para ver las citas</span></div>
        <div style="position:relative;height:${altoTemas}px"><canvas id="ch-absa-temas"></canvas></div></div>
      <div class="card"><div class="card-title">📅 Menciones por sesión</div>
        <div class="cw-tall"><canvas id="ch-absa-ses"></canvas></div></div>
    </div>
    <div class="card"><div class="card-title">🔥 Cuándo aparece cada tema <span style="font-size:11px;color:var(--muted);font-weight:400">· los 10 temas más frecuentes por sesión</span></div>${heat}</div>
    <div class="card"><div class="card-title">💬 Lo que dijeron los estudiantes ${TEMA_ABSA?`<span class="badge b-green">${escapeHtml(TEMA_ABSA)}</span>`:''}</div>
      ${chips}
      ${citas||'<div class="absa-vacio">Sin citas para esta selección.</div>'}
      ${ordenadas.length>ABSA_LIMITE?`<div style="text-align:center;margin-top:14px"><button class="btn-sm" onclick="absaMasCitas()">Ver ${Math.min(25,ordenadas.length-ABSA_LIMITE)} más (${ordenadas.length-ABSA_LIMITE} restantes)</button></div>`:''}
      <div class="absa-nota">Se muestran solo menciones vigentes (se excluyen las que el propio estudiante indica que ya resolvió). Análisis generado ${escapeHtml(g.generado||'')} sobre ${g.n_audios} audios transcritos localmente. Una mención que nombra dos temas cuenta en ambos. Es una lectura automática: úsala como punto de partida para revisar las citas, no como veredicto.</div>
    </div>`;
}

  const cvT=document.getElementById('ch-absa-temas');
  if(cvT){
    const ms=absaFiltradas();
    const{lista}=absaAgregar(ms);
    const top=lista.slice(0,12);
    try{if(CH['ch-absa-temas'])CH['ch-absa-temas'].destroy();}catch(e){}
    CH['ch-absa-temas']=new Chart(cvT,{type:'bar',
      data:{labels:top.map(x=>x.tema.length>34?x.tema.slice(0,33)+'…':x.tema),datasets:[
        {label:'Dificultad',data:top.map(x=>x.DIFICULTAD),backgroundColor:'rgba(248,113,113,0.75)',borderRadius:3},

        onClick:(ev,els)=>{if(els.length){const i=ABSA_TEMAS_VISTOS.indexOf(top[els[0].index].tema);if(i>=0)seleccionarTemaAbsa(i);}}}});
